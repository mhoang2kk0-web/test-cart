name: Build Fabric Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: cd Cart_Test_Mod_Fabric_1.21.11 && gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: cart-test-mod
          path: Cart_Test_Mod_Fabric_1.21.11/build/libs/*.jar
          if-no-files-found: error
